<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shinobi HUD - Gemini 3</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; color: white; }
        #brand-tag { position: absolute; top: 20px; left: 20px; font-size: 0.55rem; letter-spacing: 3px; color: rgba(255, 255, 255, 0.4); text-transform: uppercase; z-index: 150; }
        #overlay { position: fixed; inset: 0; background: black; z-index: 200; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; text-align: center; }
        #overlay h1 { font-size: 0.8rem; letter-spacing: 5px; color: #ff3333; margin-bottom: 20px; }
        #instructions { font-size: 0.5rem; line-height: 1.6; color: rgba(255,255,255,0.7); letter-spacing: 1px; max-width: 300px; text-transform: uppercase; margin-bottom: 30px; }
        #gemini-credit { font-size: 0.45rem; color: rgba(255,255,255,0.4); letter-spacing: 2px; position: absolute; bottom: 40px; }
        #state-text { position: absolute; top: 8%; width: 100%; text-align: center; font-size: 0.65rem; letter-spacing: 12px; z-index: 100; text-transform: uppercase; font-weight: bold; pointer-events: none; }
        #facetime-box { position: absolute; bottom: 30px; left: 30px; width: 150px; height: 200px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.2); z-index: 50; }
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        canvas#skeleton_canvas { position: absolute; width: 100%; height: 100%; z-index: 61; transform: scaleX(-1); }
        #three_canvas { position: absolute; inset: 0; z-index: 5; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } } </script>
</head>
<body>

    <div id="brand-tag">CREATED BY 0RIXIS</div>
    
    <div id="overlay" onclick="startApp()">
        <h1>SURGE CHAKRA</h1>
        <div id="instructions">
            RASENGAN: FLAT UPRIGHT PALM<br>
            CHIDORI: DOWNWARD CLAW GESTURE<br>
            KAMUI: V-SIGN (INDEX + MIDDLE UP)<br>
            AMATERASU: HOLD THE TIGHT FIST FAR FROM THE CAMERA<br>
            RECEIVERS: INDEX UP / OTHERS FOLDED<br>
            (SHATTERS AFTER 3S | 2S COOLDOWN)
        </div>
        <div id="gemini-credit">built by Gemini 3, Enjoy!</div>
    </div>

    <div id="state-text">NEUTRAL STATE</div>
    
    <div id="facetime-box">
        <video id="input_video" playsinline muted autoplay></video>
        <canvas id="skeleton_canvas"></canvas>
    </div>

<script type="module">
    import * as THREE from 'three';

    let appStarted = false;
    let receiverStartTime = 0;
    let cooldownEndTime = 0;
    let isShattered = false;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 1, 3000);
    camera.position.z = 250;
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);
    renderer.domElement.id = "three_canvas";

    const createPointTexture = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 64; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createRadialGradient(32,32,0,32,32,32);
        grad.addColorStop(0, 'white');
        grad.addColorStop(0.2, 'rgba(255,255,255,0.9)');
        grad.addColorStop(0.5, 'rgba(0,180,255,0.4)');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,64,64);
        return new THREE.CanvasTexture(canvas);
    };

    const COUNT = 18000;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(COUNT * 3);
    const tar = new Float32Array(COUNT * 3);
    const base = new Float32Array(COUNT * 3); 
    
    for(let i=0; i<COUNT; i++) {
        base[i*3] = (Math.random()-0.5)*1800; 
        base[i*3+1] = (Math.random()-0.5)*1800; 
        base[i*3+2] = (Math.random()-0.5)*800;
        pos[i*3] = base[i*3]; pos[i*3+1] = base[i*3+1]; pos[i*3+2] = base[i*3+2];
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ size: 1.6, map: createPointTexture(), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
    const points = new THREE.Points(geo, mat);
    scene.add(points);

    const video = document.getElementById('input_video');
    const canvas = document.getElementById('skeleton_canvas');
    const ctx = canvas.getContext('2d');
    const label = document.getElementById('state-text');

    const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });

    window.startApp = () => { document.getElementById('overlay').style.display = 'none'; appStarted = true; };

    let mode = "neutral";
    let hX = 0, hY = 0;

    hands.onResults((res) => {
        if (!appStarted) return;
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const now = Date.now();

        if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
            const lm = res.multiHandLandmarks[0];
            drawConnectors(ctx, lm, HAND_CONNECTIONS, {color: '#ffffff', lineWidth: 1.2});
            drawLandmarks(ctx, lm, {color: '#00ccff', lineWidth: 1, radius: 2});

            hX = (0.5 - lm[9].x) * 500; hY = (0.5 - lm[9].y) * 400;
            const d = (p1, p2) => Math.hypot(lm[p1].x - lm[p2].x, lm[p1].y - lm[p2].y);

            const isFist = d(8,0) < 0.16 && d(12,0) < 0.16;
            const isPalm = d(8,0) > 0.38 && d(20,0) > 0.38;
            const isPointing = lm[8].y < lm[6].y && lm[12].y > lm[10].y && lm[16].y > lm[14].y;
            // EASIER KAMUI: Index and Middle extended, Ring and Pinky folded.
            const isKamuiSign = (lm[8].y < lm[6].y) && (lm[12].y < lm[10].y) && (lm[16].y > lm[14].y) && (lm[20].y > lm[18].y);

            const prevMode = mode;
            if (now < cooldownEndTime) {
                mode = "neutral"; label.innerText = "CHAKRA RECHARGING..."; label.style.color = "#444444";
            } else {
                if (isKamuiSign && !isPalm) {
                    mode = "kamui"; label.innerText = "KAMUI"; label.style.color = "#ffffff"; isShattered = false;
                } else if (isPointing && !isPalm && !isShattered) {
                    mode = "receivers"; label.innerText = "BLACK CHAKRA RECEIVERS"; label.style.color = "#990000";
                    if (prevMode !== "receivers") receiverStartTime = now;
                } else if (isFist) {
                    mode = "amaterasu"; label.innerText = "AMATERASU"; label.style.color = "#ff0044"; isShattered = false;
                } else if (d(8, 20) < 0.35 && !isPalm && !isFist) {
                    mode = "chidori"; label.innerText = "CHIDORI"; label.style.color = "#aaccff"; isShattered = false;
                } else if (isPalm) {
                    mode = "rasengan"; label.innerText = "RASENGAN"; label.style.color = "#00ccff"; isShattered = false;
                } else {
                    mode = "neutral"; label.innerText = "NEUTRAL STATE"; label.style.color = "#ffffff"; isShattered = false;
                }
            }
        } else {
            mode = "neutral"; label.innerText = "NEUTRAL STATE"; label.style.color = "#ffffff"; isShattered = false;
        }
    });

    function animate() {
        requestAnimationFrame(animate);
        const p = geo.attributes.position.array;
        const time = Date.now() * 0.001;
        const now = Date.now();

        if (mode === "receivers" && !isShattered) {
            if (now - receiverStartTime > 3000) { 
                isShattered = true; mode = "neutral"; cooldownEndTime = now + 2000; 
            }
        }

        for(let i=0; i<COUNT; i++) {
            const i3 = i * 3;
            if (isShattered && (now - (cooldownEndTime - 2000) < 600)) {
                p[i3] += (p[i3] - hX) * 0.18; p[i3+1] += (p[i3+1] - hY) * 0.18; p[i3+2] += (p[i3+2]) * 0.18;
                continue;
            }

            if (mode === "neutral") {
                mat.color.setHex(0xffffff);
                tar[i3] = base[i3] + Math.sin(time + i*0.05) * 15;
                tar[i3+1] = base[i3+1] + Math.cos(time + i*0.05) * 15;
                tar[i3+2] = base[i3+2];
            } else if (mode === "rasengan") {
                mat.color.setHex(0x00ccff);
                const layer = i % 2;
                if (layer === 0) { 
                    const r = 38 + Math.random() * 4;
                    const phi = Math.acos(-1 + (2 * i) / (COUNT/2));
                    const theta = Math.sqrt((COUNT/2) * Math.PI) * phi + time * 25;
                    tar[i3] = hX + r * Math.cos(theta) * Math.sin(phi);
                    tar[i3+1] = hY + r * Math.sin(theta) * Math.sin(phi);
                    tar[i3+2] = r * Math.cos(phi);
                } else { 
                    const r = 45 + Math.random() * 15;
                    const phi = Math.acos(-1 + (2 * i) / (COUNT/2));
                    const theta = Math.sqrt((COUNT/2) * Math.PI) * phi - time * 15;
                    tar[i3] = hX + r * Math.cos(theta) * Math.sin(phi);
                    tar[i3+1] = hY + r * Math.sin(theta) * Math.sin(phi);
                    tar[i3+2] = r * Math.cos(phi);
                }
            } else if (mode === "chidori") {
                mat.color.setHex(0xaaccff);
                const boltId = i % 12;
                const segment = (i / 12) % 40;
                const angle = boltId * (Math.PI * 2 / 12) + Math.sin(time * 15 + boltId);
                const length = segment * 5.5;
                const noise = (Math.random() - 0.5) * 45;
                tar[i3] = hX + Math.cos(angle) * length + noise;
                tar[i3+1] = hY + Math.sin(angle) * length + noise;
                tar[i3+2] = (Math.random() - 0.5) * 120;
            } else if (mode === "receivers") {
                mat.color.setHex(0x990000);
                const rodId = i % 7;
                const rodProgress = (i / COUNT) * 7 % 1.0; 
                const taper = rodProgress; 
                const xOff = (rodId - 3.5) * 45;
                const vibrate = (now - receiverStartTime > 2500) ? (Math.random()-0.5)*22 : 0;
                tar[i3] = hX + xOff + (Math.random()-0.5) * (12 * taper) + vibrate;
                tar[i3+1] = hY + (rodProgress * 280 - 140);
                tar[i3+2] = Math.sin(rodId) * 40;
            } else if (mode === "kamui") {
                mat.color.setHex(0xffffff);
                const angle = i * 0.15 + time * 18;
                const rad = (200 - (time * 150 + i * 0.4) % 200);
                tar[i3] = hX + Math.cos(angle) * rad;
                tar[i3+1] = hY + Math.sin(angle) * rad;
                tar[i3+2] = -rad;
            } else { // Amaterasu
                mat.color.setHex(0xff0044);
                const r = 75 + Math.sin(time * 25 + i) * 10;
                const phi = Math.acos(-1 + (2 * i) / COUNT);
                const theta = Math.sqrt(COUNT * Math.PI) * phi + time * 5;
                tar[i3] = hX + r * Math.cos(theta) * Math.sin(phi);
                tar[i3+1] = hY + r * Math.sin(theta) * Math.sin(phi);
                tar[i3+2] = r * Math.cos(phi);
            }

            const speed = (mode === "neutral" || isShattered) ? 0.02 : 0.45;
            p[i3] += (tar[i3] - p[i3]) * speed;
            p[i3+1] += (tar[i3+1] - p[i3+1]) * speed;
            p[i3+2] += (tar[i3+2] - p[i3+2]) * speed;
        }
        geo.attributes.position.needsUpdate = true;
        renderer.render(scene, camera);
    }

    const cam = new Camera(video, { onFrame: async () => { await hands.send({image: video}); }, width: 1280, height: 720 });
    cam.start();
    animate();
</script>
</body>
</html>
